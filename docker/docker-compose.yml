# Coworkerd on one machine with Docker Compose.
#
#   docker compose up -d --wait                     one node (node-1), the object store and the
#                                                   control plane (apiserver, the API of cowctl)
#   docker compose --profile cluster up -d --wait   three nodes (node-1..3)
#   cowctl deploy                                    deploy a Wrangler project through the control plane
#   docker compose run --rm tool upsert --manifest /work/manifest.json
#                                                   deploy with the tool directly (the project directory:
#                                                   COWORKERD_PROJECT_DIR)
#   docker compose run --rm tool token              the management token
#   docker compose run --rm tool admin-credential   the administrator's credential of the API (cowctl tenant ...)
#   docker compose run --rm secrets add-node ID     a node joining the running cluster: its own identity and directory
#                                                   (the object store takes the identity within seconds, no restart)
#   docker compose run --rm secrets remove-node ID  a node leaving for good: its identity withdrawn, its directory removed
#   docker compose --profile cluster down -v        stop and delete everything, data included
#
# Only the nodes' ingress ports and the control plane reach the host (COWORKERD_BIND, COWORKERD_HTTP_PORT
# and the next two ports, COWORKERD_CONTROL_PORT). The object store lives on an internal network: it holds the whole
# state of the cluster (the members, the desired state, the suspects and the usage); the nodes and the control plane keep
# none of their own. Every container runs as an unprivileged user (10001). The first start generates every credential of
# the cluster into the `secrets` volume (the object store's identities -- deploy, and one per node --, the management
# token unless COWORKERD_MANAGEMENT_TOKEN is set, the API's administrator credential unless COWORKERD_ADMIN_CREDENTIAL is
# set, the cluster key the nodes sign their peer connections with, the secrets key that seals the secrets' values in the
# tenants' manifests), one directory per service that reads them, and each service mounts only its own: a node holds its
# own identity of the store (it reads what a node reads and writes only below members/<id>/ and nodes/<id>/), the cluster
# key and the secrets key; the control plane (and the tool) the deploy identity, the administrator's credential and the
# secrets key. Rotation: docs/guide/install.md.
# Tenant Workers reach the network through their node only (egress.* in the node's configuration; by default public
# addresses on ports 80 and 443, never the cluster's own). Settings: .env (see .env.example) or the environment.
name: ${COWORKERD_PROJECT:-coworkerd}

x-image: &image coworkerd:${COWORKERD_VERSION:-0.4.0}

x-node: &node
  image: *image
  init: true
  restart: unless-stopped
  # The Server drains its in-flight calls on SIGTERM (30 s by default) before it exits.
  stop_grace_period: 45s
  depends_on:
    init:
      condition: service_completed_successfully
  healthcheck:
    test: ["CMD", "coworkerd-entrypoint", "healthcheck"]
    interval: 5s
    timeout: 3s
    retries: 3
    start_period: 60s
    start_interval: 1s

x-node-environment: &node-environment
  COWORKERD_STORAGE_ENDPOINT: http://storage:8333
  COWORKERD_MANAGEMENT_TOKEN: ${COWORKERD_MANAGEMENT_TOKEN:-}
  COWORKERD_PROCESS_COUNT: ${COWORKERD_PROCESS_COUNT:-1}

services:
  storage:
    # 4.29 and later make create-if-absent hold under concurrency (the membership measures it at every start).
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    user: "10001:10001"
    restart: unless-stopped
    depends_on:
      secrets:
        condition: service_completed_successfully
    # Starts once the secrets step has written s3.json (the deploy identity, which the store reads at its start) and
    # security.toml. Only the S3 gateway listens on the container's network -- S3 itself, guarded by the identities'
    # signatures, and its gRPC interface, which security.toml closes to everyone; the master, volume and filer servers
    # (the filer's identity service among them) listen on its loopback only, where the gateway reaches them. Every
    # node's identity comes as hotload/<id>.weed, one the secrets step withdraws (remove-node) as hotload/<id>.remove.weed:
    # every 2 s a loop beside the store applies each such file it has not applied yet since the container started with
    # weed shell (s3.configure, kept in the filer and in force at once) until the identity is there, or gone, so that
    # each one can be withdrawn without a restart; its output discarded (it prints the identities).
    entrypoint:
      - /bin/sh
      - -c
      - >-
        until [ -s /config/s3.json ] && [ -s /config/security.toml ]; do sleep 0.2; done;
        (applied=""; while sleep 2; do for f in /config/hotload/*.weed; do [ -f "$$f" ] || continue;
        sum=$$(cksum < "$$f"); case "$$applied" in *"|$$sum|"*) continue;; esac; id=$${f##*/}; id=$${id%.weed};
        case "$$id" in *.remove) id=$${id%.remove}; want=no;; *) want=yes;; esac;
        cd /tmp && timeout 60 /usr/bin/weed shell < "$$f" > /dev/null 2>&1 &&
        if printf 's3.configure\n' | timeout 60 /usr/bin/weed shell 2>/dev/null | grep -q "\"name\": \"node-$$id\"";
        then have=yes; else have=no; fi && [ "$$have" = "$$want" ] &&
        applied="$$applied|$$sum|"; done; done) &
        cd /config && exec /usr/bin/weed server -ip=127.0.0.1 -ip.bind=127.0.0.1 -s3.ip.bind=0.0.0.0 -dir=/data -volume.max=20
        -master.volumeSizeLimitMB=64 -s3 -s3.config=/config/s3.json
    volumes:
      - storage-data:/data
      - {type: volume, source: secrets, target: /config, read_only: true, volume: {subpath: storage}}
    networks: [backend]

  # Every credential of the cluster, each into the directory of the service that reads it; then it exits. No
  # network. `docker compose run --rm secrets rotate-cluster-key add|promote|retire` rotates the cluster key;
  # `docker compose run --rm secrets add-node ID` adds a node's identity (and its directory nodes/ID).
  secrets:
    image: *image
    entrypoint: [coworkerd-entrypoint, secrets]
    restart: "no"
    environment:
      COWORKERD_MANAGEMENT_TOKEN: ${COWORKERD_MANAGEMENT_TOKEN:-}
      COWORKERD_ADMIN_CREDENTIAL: ${COWORKERD_ADMIN_CREDENTIAL:-}
      COWORKERD_NODE_IDS: node-1,node-2,node-3
    volumes:
      - secrets:/var/lib/coworkerd-secrets
      - storage-data:/var/lib/coworkerd-storage
    network_mode: none

  # The bucket and the store's self-check (with the first node's identity: its prefix policy reported); the cluster's
  # marker and empty indexes in the object store (coworkerd-apiserver tool init); then it exits.
  init:
    image: *image
    command: [init]
    restart: "no"
    depends_on:
      storage:
        condition: service_started
    environment:
      COWORKERD_STORAGE_ENDPOINT: http://storage:8333
    volumes:
      - secrets:/var/lib/coworkerd-secrets
    networks: [backend]

  node-1:
    <<: *node
    environment:
      <<: *node-environment
      COWORKERD_NODE_ID: node-1
      # The peer listener (other nodes, trial loads) listens on the backend network only.
      COWORKERD_PEER_ADDRESS: node-1-peer:8934
      COWORKERD_PEER_LISTEN_ADDRESS: node-1-peer:8934
    networks:
      frontend: {}
      backend:
        aliases: [node-1-peer]
    ports: ["${COWORKERD_BIND:-127.0.0.1}:${COWORKERD_HTTP_PORT:-18080}:8930"]
    volumes:
      - node-1-data:/var/lib/coworkerd
      - {type: volume, source: secrets, target: /var/lib/coworkerd-secrets, read_only: true, volume: {subpath: nodes/node-1}}

  node-2:
    <<: *node
    profiles: [cluster]
    environment:
      <<: *node-environment
      COWORKERD_NODE_ID: node-2
      # The peer listener (other nodes, trial loads) listens on the backend network only.
      COWORKERD_PEER_ADDRESS: node-2-peer:8934
      COWORKERD_PEER_LISTEN_ADDRESS: node-2-peer:8934
    networks:
      frontend: {}
      backend:
        aliases: [node-2-peer]
    ports: ["${COWORKERD_BIND:-127.0.0.1}:${COWORKERD_HTTP_PORT_2:-18081}:8930"]
    volumes:
      - node-2-data:/var/lib/coworkerd
      - {type: volume, source: secrets, target: /var/lib/coworkerd-secrets, read_only: true, volume: {subpath: nodes/node-2}}

  node-3:
    <<: *node
    profiles: [cluster]
    environment:
      <<: *node-environment
      COWORKERD_NODE_ID: node-3
      # The peer listener (other nodes, trial loads) listens on the backend network only.
      COWORKERD_PEER_ADDRESS: node-3-peer:8934
      COWORKERD_PEER_LISTEN_ADDRESS: node-3-peer:8934
    networks:
      frontend: {}
      backend:
        aliases: [node-3-peer]
    ports: ["${COWORKERD_BIND:-127.0.0.1}:${COWORKERD_HTTP_PORT_3:-18082}:8930"]
    volumes:
      - node-3-data:/var/lib/coworkerd
      - {type: volume, source: secrets, target: /var/lib/coworkerd-secrets, read_only: true, volume: {subpath: nodes/node-3}}

  # The control plane: coworkerd-apiserver, the API of cowctl, on the backend network (the object
  # store, the nodes' peer listeners) and published to the host. It keeps no state of its own: the desired state is the
  # object store's, which it holds a copy of in memory.
  apiserver:
    image: *image
    init: true
    restart: unless-stopped
    command: [apiserver]
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      COWORKERD_STORAGE_ENDPOINT: http://storage:8333
      COWORKERD_MANAGEMENT_TOKEN: ${COWORKERD_MANAGEMENT_TOKEN:-}
      COWORKERD_ADMIN_CREDENTIAL: ${COWORKERD_ADMIN_CREDENTIAL:-}
    healthcheck:
      test: ["CMD", "coworkerd-entrypoint", "healthcheck", "apiserver"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 30s
      start_interval: 1s
    networks: [frontend, backend]
    ports: ["${COWORKERD_BIND:-127.0.0.1}:${COWORKERD_CONTROL_PORT:-18090}:8940"]
    volumes:
      - {type: volume, source: secrets, target: /var/lib/coworkerd-secrets, read_only: true, volume: {subpath: apiserver}}

  # The deployment tool inside the cluster's network: `docker compose run --rm tool upsert ...` (coworkerd-apiserver tool).
  tool:
    image: *image
    profiles: [tools]
    entrypoint: [coworkerd-entrypoint, tool]
    command: [version]
    environment:
      COWORKERD_STORAGE_ENDPOINT: http://storage:8333
      COWORKERD_MANAGEMENT_TOKEN: ${COWORKERD_MANAGEMENT_TOKEN:-}
      COWORKERD_ADMIN_CREDENTIAL: ${COWORKERD_ADMIN_CREDENTIAL:-}
    volumes:
      - {type: volume, source: secrets, target: /var/lib/coworkerd-secrets, read_only: true, volume: {subpath: apiserver}}
      - ${COWORKERD_PROJECT_DIR:-./examples/hello}:/work:ro
    networks: [backend]

networks:
  # The object store and the nodes' peer listeners: no gateway, so neither a route out nor one in from the
  # host; only the cluster's containers reach them.
  backend:
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
  # The nodes' ingress and the control plane, published to the host.
  frontend: {}

volumes:
  storage-data:
  secrets:
  node-1-data:
  node-2-data:
  node-3-data:
