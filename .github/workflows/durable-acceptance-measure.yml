name: Durable acceptance measurement

on:
  workflow_dispatch:
  push:
    branches: [codex/40-threaded-acceptance]
    paths:
      - .github/workflows/durable-acceptance-measure.yml
      - tests/cluster/durable-wake-measure.mjs

permissions:
  contents: read

jobs:
  wake:
    name: Paired wake latency and hibernation
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CC: clang-19
      CXX: clang++-19
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-19 libstdc++-14-dev cmake ninja-build libssl-dev git curl ca-certificates python3
          npm ci --prefix cli --registry=https://registry.npmjs.org
      - name: Build the release daemons and verify the published kernel
        run: |
          kernel=$(python3 scripts/fetch-kernel.py --arch linux-x86_64)
          bash scripts/build.sh -DCOWORKERD_TEST_WORKERD="$kernel/workerd"
          printf 'KERNEL_DIR=%s\n' "$kernel" >> "$GITHUB_ENV"
      - name: Measure upstream and threaded in sequence
        run: |
          mkdir -p build/durable-acceptance
          clang-19 --version > build/durable-acceptance/compiler.txt
          node tests/cluster/durable-wake-measure.mjs "$KERNEL_DIR" build/durable-acceptance/wake.jsonl \
            2>&1 | tee build/durable-acceptance/wake.log
        shell: bash
      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: durable-acceptance-linux-x86_64
          path: |
            build/durable-acceptance/
            build/cluster-diagnostics/
          if-no-files-found: ignore
          retention-days: 90
