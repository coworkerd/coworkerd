name: Durable log I/O measurement
on:
  push:
    branches: [codex/95-durable-log-measurement]

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CC: clang-19
      CXX: clang++-19
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      WRANGLER_SEND_METRICS: 'false'
      CANDIDATE: 9536c4279e1291e5e37765c9e828dd0ccf7dd538
      BASELINE: 01a9af30fdca886e1cc4ae3b82399c202099fe78
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Prepare the Linux tools and pin
        id: kernel
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-19 libstdc++-14-dev cmake ninja-build libssl-dev dmsetup
          if ! sudo modprobe dm-delay; then
            sudo apt-get install -y --no-install-recommends "linux-modules-extra-$(uname -r)"
            sudo modprobe dm-delay
          fi
          npm ci --prefix cli --registry=https://registry.npmjs.org
          kernel=$(python3 scripts/fetch-kernel.py --arch linux-x86_64)
          printf 'path=%s\n' "$kernel" >> "$GITHUB_OUTPUT"
      - name: Build both variants on this runner
        run: |
          git worktree add --detach "$RUNNER_TEMP/log-baseline" "$BASELINE"
          bash "$RUNNER_TEMP/log-baseline/scripts/build.sh"
          mkdir -p "$RUNNER_TEMP/plain"
          cp "$RUNNER_TEMP/log-baseline/build/"{coworkerd,coworkerd-apiserver,coworkerd-launcher} "$RUNNER_TEMP/plain/"
          cp node/{durable-log.c++,durable-log.h,main.c++} "$RUNNER_TEMP/log-baseline/node/"
          bash "$RUNNER_TEMP/log-baseline/scripts/build.sh"
      - name: Measure on ext4 and on the independent delayed block device
        env:
          KERNEL: ${{ steps.kernel.outputs.path }}
        run: |
          mkdir reports
          printf 'baseline=%s\ncandidate=%s\n' "$BASELINE" "$CANDIDATE" | tee reports/revisions.txt
          bash tests/cluster/durable-log-io/run.sh "$RUNNER_TEMP/plain" "$RUNNER_TEMP/log-baseline/build" "$KERNEL" reports
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: durable-log-io-${{ github.run_attempt }}
          path: reports/
          if-no-files-found: warn
