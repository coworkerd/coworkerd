name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-unit-tests:
    name: Build and unit tests (linux-x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CC: clang-19
      CXX: clang++-19
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install public build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-19 cmake ninja-build libssl-dev git
          npm ci --prefix cli --registry=https://registry.npmjs.org
      - name: Build daemons
        run: bash scripts/build.sh -DCOWORKERD_TEST_WORKERD= -DCOWORKERD_TEST_JUNIT="$PWD/build/test-results.xml"
      - name: Run unit and component tests
        run: cmake --build build --target check
      - name: Report executed tests
        if: always() && hashFiles('build/test-results.xml') != ''
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          root = ET.parse('build/test-results.xml').getroot()
          cases = root.findall('.//testcase')
          failed = [c for c in cases if c.find('failure') is not None or c.find('error') is not None]
          skipped = [c for c in cases if c.find('skipped') is not None]
          summary = f'CTest: {len(cases)} tests, {len(failed)} failed, {len(skipped)} skipped.'
          print(summary)
          guide = (os.environ['GITHUB_SERVER_URL'] + '/' + os.environ['GITHUB_REPOSITORY']
                   + '/blob/' + os.environ['GITHUB_SHA'] + '/CONTRIBUTING.md#ci-and-local-unit-tests')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write(summary + '\n\nSee [CONTRIBUTING.md](' + guide + ') '
                           'for the kernel-dependent tests omitted pending #2.\n')
          if not cases or failed or skipped:
              raise SystemExit('Expected a nonempty test suite with no failures or skipped tests')
          PY
