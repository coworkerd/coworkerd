name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  WRANGLER_SEND_METRICS: 'false'

jobs:
  linux-build-and-unit-tests:
    name: Linux build and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      CC: clang-19
      CXX: clang++-19
      CMAKE_BUILD_PARALLEL_LEVEL: 4
    steps:
      - &checkout
        name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - &setup-node
        name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install Ubuntu build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-19 libstdc++-14-dev cmake ninja-build libssl-dev git curl ca-certificates python3
      - &install-cli
        name: Install CLI dependencies
        run: npm ci --prefix cli --registry=https://registry.npmjs.org
      - name: Test kernel archive verification
        run: python3 scripts/test-kernel-artifacts.py
      - name: Read the Linux kernel pin
        id: kernel-pin
        run: |
          digest=$(python3 scripts/fetch-kernel.py --arch linux-x86_64 --sha256)
          printf 'sha256=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: Cache the Linux kernel archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/kernel/${{ steps.kernel-pin.outputs.sha256 }}
          key: kernel-linux-x86_64-${{ steps.kernel-pin.outputs.sha256 }}
      - name: Fetch and verify the Linux kernel
        run: |
          kernel=$(python3 scripts/fetch-kernel.py --arch linux-x86_64)
          printf 'TEST_WORKERD=%s/workerd\n' "$kernel" >> "$GITHUB_ENV"
      - &build-daemons
        name: Build daemons
        run: bash scripts/build.sh -DCOWORKERD_TEST_WORKERD="${TEST_WORKERD:-}" -DCOWORKERD_TEST_JUNIT="$PWD/build/test-results.xml"
      - &check-unit-tests
        name: Run unit and component tests
        run: cmake --build build --target check
      - &report-unit-tests
        name: Report executed tests
        if: success() || (failure() && hashFiles('build/test-results.xml') != '')
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          root = ET.parse('build/test-results.xml').getroot()
          cases = root.findall('.//testcase')
          failed = [c for c in cases if c.find('failure') is not None or c.find('error') is not None]
          skipped = [c for c in cases if c.find('skipped') is not None]
          required = ({'node-log-redaction', 'workerd-configuration', 'node-child-memory',
                       'node-threaded-durable-storage-lifecycle',
                       'node-threaded-durable-process-memory', 'node-threaded-durable-process-heap',
                       'node-threaded-durable-reset-progress',
                       'node-threaded-durable-cpu-events', 'node-threaded-durable-rpc-cpu',
                       'node-threaded-durable-rpc-events', 'node-threaded-durable-rpc-output-gate',
                       'node-threaded-durable-launch', 'node-threaded-durable-home-reservation',
                       'node-threaded-durable-warm-copies',
                       'node-threaded-durable-load-cancel',
                       'node-threaded-durable-http',
                       'node-threaded-durable-http-isolation',
                       'node-threaded-durable-http-output-gate',
                       'node-threaded-durable-http-memory',
                       'node-threaded-durable-group-refusal',
                       'node-threaded-durable-http-overlap',
                       'node-threaded-durable-placement', 'node-threaded-durable-queues',
                       'node-threaded-durable-fd-limit', 'node-threaded-durable-memory-reservation'}
                      if os.environ['RUNNER_OS'] == 'Linux' else set())
          missing = required - {c.get('name') for c in cases}
          summary = f'CTest: {len(cases)} tests, {len(failed)} failed, {len(skipped)} skipped.'
          if missing:
              summary += ' Missing kernel tests: ' + ', '.join(sorted(missing)) + '.'
          print(summary)
          guide = (os.environ['GITHUB_SERVER_URL'] + '/' + os.environ['GITHUB_REPOSITORY']
                   + '/blob/' + os.environ['GITHUB_SHA'] + '/CONTRIBUTING.md#ci-and-local-unit-tests')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write(summary + '\n\nSee [CONTRIBUTING.md](' + guide + ') '
                           'for kernel test prerequisites.\n')
          if not cases or failed or skipped or missing:
              raise SystemExit('Expected a nonempty test suite including all required tests, with no failures or skips')
          PY
      - name: Pack cluster test inputs
        run: |
          tar -cf "$RUNNER_TEMP/cluster-inputs.tar" \
            -C "$PWD/build" coworkerd coworkerd-apiserver coworkerd-launcher coworkerd-platform-test \
            -C "$(dirname "$TEST_WORKERD")" workerd coworkerd-threaded allowlist
      - name: Upload cluster test inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cluster-inputs
          path: ${{ runner.temp }}/cluster-inputs.tar
          compression-level: 1
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  macos-build-and-unit-tests:
    name: Build and unit tests (macos-arm64)
    runs-on: macos-26
    timeout-minutes: 55
    env:
      CC: /usr/bin/clang
      CXX: /usr/bin/clang++
      CMAKE_BUILD_PARALLEL_LEVEL: 4
    steps:
      - *checkout
      - *setup-node
      - name: Select OpenSSL on macOS
        run: |
          openssl_root="$(brew --prefix openssl@3)"
          printf 'OPENSSL_ROOT_DIR=%s\n' "$openssl_root" >> "$GITHUB_ENV"
      - *install-cli
      - *build-daemons
      - *check-unit-tests
      - *report-unit-tests

  cluster:
    name: Cluster integration tests (shard ${{ matrix.shard }})
    needs: linux-build-and-unit-tests
    runs-on: ubuntu-24.04
    # The longest shard takes 16 minutes on a usual runner and has taken 20. Leave room for a slow one.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - *checkout
      - *setup-node
      - *install-cli
      - name: Download cluster test inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cluster-inputs
          path: ${{ runner.temp }}
      - name: Unpack cluster test inputs
        run: |
          mkdir -p build
          tar -xf "$RUNNER_TEMP/cluster-inputs.tar" -C build
      - name: Run cluster integration tests
        timeout-minutes: 30
        env:
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: |
          uname -sm
          nproc
          free -m
          df -h "$PWD"
          du -sh build
          docker version --format 'Docker Engine {{.Server.Version}}'
          docker compose version
          node tests/cluster/run.mjs "$PWD/build" --shard "$SHARD"

  linux-required:
    # This name is the required status check in the main ruleset.
    name: Build and unit tests (linux-x86_64)
    needs: [linux-build-and-unit-tests, cluster]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require a successful Linux build and every cluster shard
        env:
          UNIT_RESULT: ${{ needs.linux-build-and-unit-tests.result }}
          CLUSTER_RESULT: ${{ needs.cluster.result }}
        run: |
          printf 'Linux build and unit tests: %s\nCluster integration tests: %s\n' "$UNIT_RESULT" "$CLUSTER_RESULT"
          test "$UNIT_RESULT" = success && test "$CLUSTER_RESULT" = success
