name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-unit-tests:
    name: Build and unit tests (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
            cc: clang-19
            cxx: clang++-19
          - platform: macos-arm64
            runner: macos-26
            cc: /usr/bin/clang
            cxx: /usr/bin/clang++
    timeout-minutes: 45
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install Ubuntu build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-19 libstdc++-14-dev cmake ninja-build libssl-dev git curl ca-certificates python3
      - name: Select OpenSSL on macOS
        if: runner.os == 'macOS'
        run: |
          openssl_root="$(brew --prefix openssl@3)"
          printf 'OPENSSL_ROOT_DIR=%s\n' "$openssl_root" >> "$GITHUB_ENV"
      - name: Install CLI dependencies
        run: npm ci --prefix cli --registry=https://registry.npmjs.org
      - name: Test kernel archive verification
        if: runner.os == 'Linux'
        run: python3 scripts/test-kernel-artifacts.py
      - name: Read the Linux kernel pin
        if: runner.os == 'Linux'
        id: kernel-pin
        run: |
          digest=$(python3 scripts/fetch-kernel.py --arch linux-x86_64 --sha256)
          printf 'sha256=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: Cache the Linux kernel archive
        if: runner.os == 'Linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/kernel/${{ steps.kernel-pin.outputs.sha256 }}
          key: kernel-linux-x86_64-${{ steps.kernel-pin.outputs.sha256 }}
      - name: Fetch and verify the Linux kernel
        if: runner.os == 'Linux'
        id: kernel
        run: |
          kernel=$(python3 scripts/fetch-kernel.py --arch linux-x86_64)
          printf 'workerd=%s/workerd\n' "$kernel" >> "$GITHUB_OUTPUT"
      - name: Build daemons
        env:
          TEST_WORKERD: ${{ steps.kernel.outputs.workerd }}
        run: bash scripts/build.sh -DCOWORKERD_TEST_WORKERD="$TEST_WORKERD" -DCOWORKERD_TEST_JUNIT="$PWD/build/test-results.xml"
      - name: Run unit and component tests
        run: cmake --build build --target check
      - name: Report executed tests
        if: success() || (failure() && hashFiles('build/test-results.xml') != '')
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          root = ET.parse('build/test-results.xml').getroot()
          cases = root.findall('.//testcase')
          failed = [c for c in cases if c.find('failure') is not None or c.find('error') is not None]
          skipped = [c for c in cases if c.find('skipped') is not None]
          required = ({'node-log-redaction', 'workerd-configuration', 'node-child-memory',
                       'node-threaded-durable-launch', 'node-threaded-durable-events',
                       'node-threaded-durable-placement', 'node-threaded-durable-queues',
                       'node-threaded-durable-fd-limit', 'node-threaded-durable-memory-reservation'}
                      if os.environ['RUNNER_OS'] == 'Linux' else set())
          missing = required - {c.get('name') for c in cases}
          summary = f'CTest: {len(cases)} tests, {len(failed)} failed, {len(skipped)} skipped.'
          if missing:
              summary += ' Missing kernel tests: ' + ', '.join(sorted(missing)) + '.'
          print(summary)
          guide = (os.environ['GITHUB_SERVER_URL'] + '/' + os.environ['GITHUB_REPOSITORY']
                   + '/blob/' + os.environ['GITHUB_SHA'] + '/CONTRIBUTING.md#ci-and-local-unit-tests')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write(summary + '\n\nSee [CONTRIBUTING.md](' + guide + ') '
                           'for kernel test prerequisites.\n')
          if not cases or failed or skipped or missing:
              raise SystemExit('Expected a nonempty test suite including all required tests, with no failures or skips')
          PY
      - name: Run cluster integration tests
        if: runner.os == 'Linux'
        timeout-minutes: 12
        env:
          TEST_WORKERD: ${{ steps.kernel.outputs.workerd }}
        run: |
          uname -sm
          nproc
          free -m
          df -h "$PWD"
          du -sh build
          docker version --format 'Docker Engine {{.Server.Version}}'
          docker compose version
          node tests/cluster/run.mjs "$(dirname "$TEST_WORKERD")"
