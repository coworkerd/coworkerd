name: Database throughput measurement

on:
  push:
    branches: [codex/85-throughput-measurements]

permissions:
  contents: read

env:
  PRODUCT_MAIN: abab77c7bdc5373743e6b5195d6ac83e4f2e29d0
  PRODUCT_OBJECT: 3cd208d51ebe78d1c19c7e7e7ec7e85cbf29e2dd
  PRODUCT_NATIVE: e88acea9a3630c67388dbccdd994b4d843a953eb

jobs:
  build:
    name: Build ${{ matrix.product }} Linux daemons
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        product: [main, object, native]
    env:
      CC: clang-19
      CXX: clang++-19
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      PRODUCT: ${{ matrix.product }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-19 libstdc++-14-dev cmake ninja-build libssl-dev git curl ca-certificates python3
      - name: Build and package the release binaries
        run: |
          case "$PRODUCT" in
            main) commit="$PRODUCT_MAIN" ;;
            object) commit="$PRODUCT_OBJECT" ;;
            native)
              git fetch https://github.com/coworkerd/coworkerd.git refs/pull/59/head
              commit="$PRODUCT_NATIVE"
              ;;
          esac
          git worktree add --detach "$RUNNER_TEMP/product" "$commit"
          (cd "$RUNNER_TEMP/product" && bash scripts/build.sh)
          tar -C "$RUNNER_TEMP/product/build" -czf "$RUNNER_TEMP/$PRODUCT.tar.gz" \
            coworkerd coworkerd-apiserver coworkerd-launcher
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: throughput-daemons-${{ matrix.product }}
          path: ${{ runner.temp }}/${{ matrix.product }}.tar.gz
          if-no-files-found: error
          overwrite: true
          compression-level: 0

  measure:
    needs: build
    name: Ubuntu 24.04 instance ${{ matrix.instance }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - instance: 1
            order: main object native
          - instance: 2
            order: object native main
          - instance: 3
            order: native main object
    env:
      ORDER: ${{ matrix.order }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/throughput-daemons
          pattern: throughput-daemons-*
          merge-multiple: true
      - name: Install shared daemon builds and fetch the published kernels
        run: |
          base="$RUNNER_TEMP/throughput-products"
          mkdir -p "$base" reports
          git fetch https://github.com/coworkerd/coworkerd.git refs/pull/59/head
          git worktree add --detach "$base/main" "$PRODUCT_MAIN"
          git worktree add --detach "$base/object" "$PRODUCT_OBJECT"
          git worktree add --detach "$base/native" "$PRODUCT_NATIVE"
          for product in main object native; do
            mkdir -p "$base/$product/build"
            tar -C "$base/$product/build" -xzf "$RUNNER_TEMP/throughput-daemons/$product.tar.gz"
            (cd "$base/$product" && python3 scripts/fetch-kernel.py > "$base/$product.kernel")
          done
      - name: Record the runner and measure each product serially
        run: |
          mkdir -p reports
          {
            uname -a
            lscpu
            free -b
            cat /etc/os-release
            docker version
            docker compose version
            df -T "$PWD" /var/lib/docker
            lsblk -o NAME,SIZE,TYPE,FSTYPE,MODEL,ROTA
            printf 'Runner image %s %s\n' "$ImageOS" "$ImageVersion"
            printf 'Product order %s\n' "$ORDER"
          } | tee reports/runner.txt
          base="$RUNNER_TEMP/throughput-products"
          failed=0
          for product in $ORDER; do
            side=object
            if [ "$product" = native ]; then side=native; fi
            docker ps --format '{{.Names}} {{.Image}}' | tee -a reports/runner.txt
            COWORKERD_CLUSTER_BIN_DIR="$base/$product/build" \
              node tests/cluster/database-home-benchmark.mjs \
              "$side" "$base/$product" "$(cat "$base/$product.kernel")" \
              "$PWD/reports/$product.jsonl" --throughput || failed=1
          done
          exit "$failed"
      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: throughput-${{ matrix.instance }}-${{ github.run_attempt }}
          path: |
            reports/
            build/cluster-diagnostics/
          if-no-files-found: warn
