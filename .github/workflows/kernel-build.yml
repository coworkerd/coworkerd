name: Build Linux kernel archives

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kernel-build.yml'
      - 'scripts/build-kernel.sh'
      - 'scripts/find-kernel-cache.sh'
      - 'patches/workerd/UPSTREAM'
      - 'patches/workerd/series'
      - 'patches/workerd/*.patch'
  workflow_dispatch:
    inputs:
      pull_request:
        description: 'Pull request number, including a fork PR.'
        type: string
      source_commit:
        description: 'Full source commit SHA. Required for a PR. Defaults to the selected branch head.'
        type: string
      cold:
        description: 'Build without reading a previous Bazel action cache.'
        type: boolean
      full_cluster:
        description: 'Also run the production cluster suite on both architectures for release verification.'
        type: boolean
      benchmark_seed:
        description: 'Save a seed for branch-only benchmarks.'
        type: boolean
      benchmark_seed_run:
        description: 'Successful seed run on the same benchmark branch.'
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'push' && 'kernel-action-cache-main' || format('kernel-archive-{0}', github.run_id) }}

jobs:
  source:
    if: github.repository == 'coworkerd/coworkerd'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Resolve source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pull_request }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          BENCHMARK_SEED: ${{ inputs.benchmark_seed }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          sha=${SOURCE_COMMIT:-$GITHUB_SHA}
          if [[ ! $sha =~ ^[0-9a-f]{40}$ ]]; then
            echo 'Provide a full lowercase source commit SHA.' >&2
            exit 1
          fi
          if [[ $BENCHMARK_SEED == true ]]; then
            if [[ $GITHUB_REF_TYPE != branch || $GITHUB_REF_NAME == "$DEFAULT_BRANCH" || -n $PR ]] ||
                ! gh api "repos/$GITHUB_REPOSITORY/compare/$sha...$DEFAULT_BRANCH" --jq .status | grep -qxE 'ahead|identical'; then
              echo 'A branch benchmark seed must build source already on the default branch.' >&2
              exit 1
            fi
          fi
          if [[ -n $PR ]]; then
            if [[ ! $PR =~ ^[1-9][0-9]*$ || -z $SOURCE_COMMIT ]]; then
              echo 'Provide the pull request number and its full lowercase head SHA.' >&2
              exit 1
            fi
            head=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .head.sha)
            if [[ $sha != "$head" ]]; then
              echo 'The pull request head changed. Review its current SHA before building.' >&2
              exit 1
            fi
            printf 'Pull request #%s\n\n' "$PR" >> "$GITHUB_STEP_SUMMARY"
          fi
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
          printf 'Coworkerd source commit %s\n' "$sha" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: source
    name: Build kernel (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 330
    permissions:
      actions: read
      contents: read
    env:
      BAZELISK_ARCH: ${{ matrix.bazelisk }}
      BAZELISK_SHA256: ${{ matrix.bazelisk-sha256 }}
      KERNEL_ARCH: ${{ matrix.arch }}
      KERNEL_COMMIT: ${{ needs.source.outputs.sha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: linux-x86_64
            runner: ubuntu-24.04
            bazelisk: amd64
            bazelisk-sha256: a248ae2b2b62b5baebb748f6fba7203bff1a27e5d01b55399a8406744cb539e8
          - arch: linux-arm64
            runner: ubuntu-24.04-arm
            bazelisk: arm64
            bazelisk-sha256: b2bcc040c213b44586b121bda6d983c35df121b917c3a7a66fb16f2fa0df1a4f
    steps:
      - name: Check out build tools at the workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false
      - name: Check out the source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.sha }}
          path: source
          persist-credentials: false
      - name: Install Node.js
        if: github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Identify compatible Bazel action outputs
        id: cache-key
        run: |
          fingerprint=$(sha256sum control/scripts/build-kernel.sh source/patches/workerd/UPSTREAM |
            sha256sum | cut -c1-24)
          echo "name=bazel-actions-v1-$KERNEL_ARCH-$ImageVersion-$fingerprint" >> "$GITHUB_OUTPUT"
      - name: Find a seed from a verified workflow run
        id: seed
        if: inputs.cold != true
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ARTIFACT: ${{ steps.cache-key.outputs.name }}
          BENCHMARK_RUN: ${{ inputs.benchmark_seed_run }}
        run: bash control/scripts/find-kernel-cache.sh
      - name: Download the Bazel action cache
        id: download
        if: steps.seed.outputs.artifact_id != ''
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.seed.outputs.run_id }}
          artifact-ids: ${{ steps.seed.outputs.artifact_id }}
          path: ${{ runner.temp }}/kernel-cache-download
      - name: Restore Bazel action outputs
        if: steps.download.outcome == 'success'
        env:
          SEED_RUN: ${{ steps.seed.outputs.run_id }}
        run: |
          cache="$RUNNER_TEMP/kernel-action-cache"
          mkdir -p "$cache"
          if tar --zstd -xf "$RUNNER_TEMP/kernel-cache-download/actions.tar.zst" -C "$cache"; then
            printf 'Bazel action cache from [run %s](%s/%s/actions/runs/%s).\n\n' \
              "$SEED_RUN" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$SEED_RUN" >> "$GITHUB_STEP_SUMMARY"
          else
            rm -rf "$cache"
            echo 'Cache extraction failed. Building without a seed.'
          fi
          rm -rf "$RUNNER_TEMP/kernel-cache-download"
      - name: Build the default-branch seed
        if: github.event_name == 'push'
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = "$KERNEL_COMMIT"
          bash ../control/scripts/measure-kernel-build.sh bash ../control/scripts/build-kernel.sh
      - name: Build, profile and test the kernel archive
        if: github.event_name == 'workflow_dispatch'
        working-directory: source
        env:
          FULL_CLUSTER: ${{ inputs.full_cluster }}
        run: |
          test "$(git rev-parse HEAD)" = "$KERNEL_COMMIT"
          bash ../control/scripts/measure-kernel-build.sh bash ../control/scripts/test-hosted-kernel.sh
      - name: Pack the Bazel action cache
        if: github.event_name == 'push' || inputs.benchmark_seed
        run: |
          tar -I 'zstd -T2 -3' -cf "$RUNNER_TEMP/actions.tar.zst" -C "$RUNNER_TEMP/kernel-action-cache" ac cas
          du -sh "$RUNNER_TEMP/actions.tar.zst"
      - name: Upload reusable default-branch action outputs
        if: github.event_name == 'push' || inputs.benchmark_seed
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.cache-key.outputs.name }}
          path: ${{ runner.temp }}/actions.tar.zst
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true
      - name: Upload cluster failure diagnostics
        if: failure() && hashFiles('source/build/kernel-ci/cluster.log') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cluster-failure-${{ matrix.arch }}-${{ github.run_attempt }}
          path: |
            source/build/kernel-ci/cluster.log
            source/build/cluster-diagnostics/
          if-no-files-found: error
      - name: Upload the verified architecture archive
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kernel-${{ matrix.arch }}-${{ github.run_attempt }}
          path: source/build/kernel-ci/archive/coworkerd-kernel-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          compression-level: 0

  assemble:
    needs: [source, build]
    if: github.event_name == 'workflow_dispatch'
    name: Verify and assemble both archives
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: kernel-linux-*-${{ github.run_attempt }}
          path: release
          merge-multiple: true
      - name: Verify source, provenance, profiles and checksums
        env:
          KERNEL_COMMIT: ${{ needs.source.outputs.sha }}
        run: python3 scripts/kernel-release.py assemble release --commit "$KERNEL_COMMIT"
      - name: Upload the release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kernel-release-${{ github.run_attempt }}
          path: |
            release/coworkerd-kernel-linux-x86_64.tar.gz
            release/coworkerd-kernel-linux-arm64.tar.gz
            release/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
