name: Waiting-call acceptance measurement
run-name: Waiting-call acceptance (${{ inputs.architecture }})

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: Linux runner and pinned kernel architecture
        type: choice
        required: true
        default: linux-x86_64
        options:
          - linux-x86_64
          - linux-arm64

permissions:
  contents: read

jobs:
  measure:
    runs-on: ${{ inputs.architecture == 'linux-arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 25
    env:
      KERNEL_ARCH: ${{ inputs.architecture }}
      CC: clang-19
      CXX: clang++-19
      CMAKE_BUILD_PARALLEL_LEVEL: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-19 libstdc++-14-dev cmake ninja-build libssl-dev git curl ca-certificates python3
          npm ci --prefix cli --registry=https://registry.npmjs.org
      - name: Build the release daemons and fetch the pinned kernel
        run: |
          python3 scripts/fetch-kernel.py --arch "$KERNEL_ARCH"
          bash scripts/build.sh
          cmake --build build --target coworkerd-launcher
      - name: Measure on the idle runner
        shell: bash
        run: |
          mkdir -p build/waiting-evidence
          lscpu > build/waiting-evidence/host.txt
          free -m >> build/waiting-evidence/host.txt
          docker ps >> build/waiting-evidence/host.txt
          kernel=$(python3 scripts/fetch-kernel.py --arch "$KERNEL_ARCH" --installed)
          export COWORKERD_CLUSTER_PRODUCT_COMMIT="$(git rev-parse HEAD^)"
          node tests/cluster/waiting-call-capacity.mjs "$kernel" build/waiting-evidence/report.jsonl \
            --batches 2000,2000,2000 --ramp-ms 300 --expect-full \
            2>&1 | tee build/waiting-evidence/measurement.log
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const rows = fs.readFileSync('build/waiting-evidence/report.jsonl', 'utf8').trim()
            .split('\n').map(JSON.parse);
          const row = rows.find(row => row.type === 'effective');
          assert.equal(row.placement.rootLimit, 7168);
          assert.equal(row.placement.nestedLimit, 8192);
          assert.equal(row.pool.inFlightLimit, 8192);
          assert.equal(row.egress.concurrency, 0);
          assert.equal(row.egress.requestsPerSecond, 0);
          NODE
          sha256sum build/waiting-evidence/report.jsonl | tee build/waiting-evidence/SHA256SUMS
      - name: Preserve raw evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: waiting-call-acceptance-${{ inputs.architecture }}
          path: build/waiting-evidence/
          if-no-files-found: ignore
