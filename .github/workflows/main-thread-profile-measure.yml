name: Node main-thread measurement

on:
  push:
    branches: [codex/95-main-thread-profile]
    paths: [.github/workflows/main-thread-profile-measure.yml]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CC: clang-19
      CXX: clang++-19
      CMAKE_BUILD_PARALLEL_LEVEL: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-19 libstdc++-14-dev cmake ninja-build libssl-dev git
      - name: Build Release daemons with symbol and frame information
        run: |
          bash scripts/build.sh -DCMAKE_CXX_FLAGS_RELEASE='-O3 -DNDEBUG -g1 -fno-omit-frame-pointer'
          tar -C build -cf "$RUNNER_TEMP/profile-daemons.tar" coworkerd coworkerd-apiserver coworkerd-launcher
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: profile-daemons
          path: ${{ runner.temp }}/profile-daemons.tar
          compression-level: 0
          if-no-files-found: error
  runner-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify Linux profiling tools
        run: |
          uname -a
          sudo perf --version
          sudo perf record --clockid mono -e cpu-clock -F 499 --call-graph dwarf,8192 -o /tmp/perf-test.data -- openssl speed -seconds 1 sha256
          sudo perf script -i /tmp/perf-test.data --ns -F comm,tid,time,event,period,ip,sym,dso | head -100
          sudo perf list 'syscalls:*fdatasync*'
