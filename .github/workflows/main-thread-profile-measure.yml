name: Node main-thread measurement

on:
  push:
    branches: [codex/95-main-thread-profile]
    paths:
      - .github/workflows/main-thread-profile-measure.yml
      - tests/cluster/main-thread-profile/**
      - tests/cluster/database-home-benchmark.mjs
      - tests/cluster/database-throughput-client.mjs

permissions:
  contents: read

concurrency:
  group: node-main-thread-measurement
  cancel-in-progress: true

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CC: clang-19
      CXX: clang++-19
      CMAKE_BUILD_PARALLEL_LEVEL: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-19 libstdc++-14-dev cmake ninja-build libssl-dev git
      - name: Fetch and verify the pinned public kernel
        id: kernel
        run: |
          kernel=$(python3 scripts/fetch-kernel.py --arch linux-x86_64)
          printf 'path=%s\n' "$kernel" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: daemons
        with:
          path: |
            build/coworkerd
            build/coworkerd-apiserver
            build/coworkerd-launcher
            build/coworkerd-bench-http-forwarder
          key: profile-daemons-326bec7-${{ hashFiles('tests/cluster/main-thread-profile/*.c++', 'tests/cluster/main-thread-profile/*.h', 'tests/cluster/main-thread-profile/instrumentation.patch') }}
      - name: Build the benchmark node and forwarder
        if: steps.daemons.outputs.cache-hit != 'true'
        run: |
          git apply tests/cluster/main-thread-profile/instrumentation.patch
          bash scripts/build.sh -DCMAKE_CXX_FLAGS_RELEASE='-O3 -DNDEBUG -g1 -fno-omit-frame-pointer'
          cmake --build build --target coworkerd-bench-http-forwarder
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: steps.daemons.outputs.cache-hit != 'true'
        with:
          path: |
            build/coworkerd
            build/coworkerd-apiserver
            build/coworkerd-launcher
            build/coworkerd-bench-http-forwarder
          key: ${{ steps.daemons.outputs.cache-primary-key }}
      - name: Record runner details
        run: |
          mkdir -p reports
          {
            uname -a
            lscpu
            free -b
            cat /etc/os-release
            docker version
            docker compose version
            df -T "$PWD" /var/lib/docker
            lsblk -o NAME,SIZE,TYPE,FSTYPE,MODEL,ROTA
            printf 'Runner image %s %s\n' "$ImageOS" "$ImageVersion"
            sudo perf --version
            clang++-19 --version
          } | tee reports/runner.txt
      - name: Verify workloads, trace and profiler
        env:
          KERNEL: ${{ steps.kernel.outputs.path }}
        run: |
          COWORKERD_PROFILE_STACKS="$PWD/reports/smoke-stacks.jsonl" \
            node tests/cluster/database-home-benchmark.mjs object "$PWD" "$KERNEL" \
            "$PWD/reports/smoke.jsonl" --main-thread-profile-smoke
      - name: Measure each path serially on the same runner
        env:
          KERNEL: ${{ steps.kernel.outputs.path }}
        run: |
          COWORKERD_PROFILE_STACKS="$PWD/reports/stacks.jsonl" \
            node tests/cluster/database-home-benchmark.mjs object "$PWD" "$KERNEL" \
            "$PWD/reports/measurement.jsonl" --main-thread-profile
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: node-main-thread-profile-${{ github.run_attempt }}
          path: reports/
          if-no-files-found: warn
